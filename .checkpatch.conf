# Kernel checkpatch for a userspace tool: run from the repository root as
#   <linux>/scripts/checkpatch.pl -f src/*.c src/*.h tools/phase0/memdump.c
--no-tree
--typedefsfile .checkpatch-typedefs
# volatile is how /dev/mem mappings must be read in userspace
--ignore VOLATILE
# messages deliberately reproduce U-Boot's ("mxc_ocotp fuse_read(): ...")
--ignore EMBEDDED_FUNCTION_NAME
# __printf() is a kernel macro; userspace uses __attribute__((format))
--ignore PREFER_DEFINED_ATTRIBUTE_MACRO
